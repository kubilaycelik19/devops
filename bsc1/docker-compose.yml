services:
  # 1. VERİTABANI
  user_db:
    image: postgres:15-alpine
    container_name: user_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: users_db
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  order_db:
    image: postgres:15-alpine
    container_name: order_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: orders_db
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

  # 2. USER SERVİSİ
  user_service:
    build: ./user_service
    image: ghcr.io/kubilaycelik19/user_service:latest
    container_name: user_service
    restart: always
    environment:
      - PORT=${USER_CONTAINER_PORT}
      - DB_HOST=user_db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=users_db
    depends_on:
      - user_db
    ports:
      - "${USER_HOST_PORT}:${USER_CONTAINER_PORT}"

  # 3. ORDER SERVİSİ
  order_service:
    build: ./order_service
    image: ghcr.io/kubilaycelik19/order_service:latest
    container_name: order_service
    restart: always
    environment:
      - PORT=${ORDER_CONTAINER_PORT}
      - DB_HOST=order_db
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=orders_db
      - USER_SERVICE_URL=http://user_service:${USER_CONTAINER_PORT}
    depends_on:
      - order_db
      - user_service
    ports:
      - "${ORDER_HOST_PORT}:${ORDER_CONTAINER_PORT}"

  # 4. FRONTEND SERVİSİ
  frontend_service:
    build: ./frontend_service
    image: ghcr.io/kubilaycelik19/frontend_service:latest
    container_name: frontend_service
    restart: always
    environment:
      - PORT=${FRONTEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

  # 5. NGINX REVERSE PROXY
  nginx:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    environment:
      - USER_CONTAINER_PORT=${USER_CONTAINER_PORT}
      - ORDER_CONTAINER_PORT=${ORDER_CONTAINER_PORT}
      - FRONTEND_CONTAINER_PORT=${FRONTEND_CONTAINER_PORT}
    ports:
      - "${NGINX_HOST_PORT}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - user_service
      - order_service
      - frontend_service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - user_service
      - order_service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # 9. TRAFFIC GENERATOR (Sentetik Trafik Botu)
  traffic_generator:
    build: ./traffic_generator
    container_name: traffic_generator
    restart: always
    environment:
      - GATEWAY_URL=http://nginx:80
    depends_on:
      - nginx

volumes:
  user_postgres_data:
  order_postgres_data:
  grafana_data: