global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # user_service /metrics — konteyner portu USER_CONTAINER_PORT (5001)
  - job_name: user_service
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - user_service:5001
        labels:
          service: user_service

  # order_service /metrics — konteyner portu ORDER_CONTAINER_PORT (5002)
  - job_name: order_service
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - order_service:5002
        labels:
          service: order_service
