server {
    listen 80;

    location / {
        proxy_pass http://frontend_service:${FRONTEND_CONTAINER_PORT}/;
    }

    location /api/frontend {
        proxy_pass http://frontend_service:${FRONTEND_CONTAINER_PORT}/;
    }

    location /api/users {
        proxy_pass http://user_service:${USER_CONTAINER_PORT}/;
    }

    location /api/orders {
        proxy_pass http://order_service:${ORDER_CONTAINER_PORT}/;
    }
}
