server {
    listen 80;

    location / {
        proxy_pass http://frontend_service:5003/;
    }

    location /api/frontend {
        proxy_pass http://frontend_service:5003/;
    }

    location /api/users {
        proxy_pass http://user_service:5001/;
    }

    location /api/orders {
        proxy_pass http://order_service:5002/;
    }
}
